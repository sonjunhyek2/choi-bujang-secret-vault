<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BYTE BACK | 로그인 자료실</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif}body{margin:0;background:#101a28;color:#ecf4ff}main{max-width:760px;margin:auto;padding:32px 20px}section,article{padding:20px;border:1px solid #51667c;border-radius:14px;margin:18px 0;background:#1a2a3d}p{line-height:1.7}label{display:block;margin:12px 0 5px}input,textarea,button{font:inherit;border-radius:7px;padding:10px;box-sizing:border-box}input,textarea{width:100%;border:1px solid #8396ac;background:#101a28;color:white}button{border:1px solid #8ad8df;background:#183e54;color:white;cursor:pointer;margin:10px 8px 0 0}button:disabled{opacity:.5;cursor:wait}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #8ad8df}textarea{min-height:110px}#message{white-space:pre-wrap;color:#ffe3b0}article p{white-space:pre-wrap}.muted{color:#bfd0e5}[hidden]{display:none!important}
</style>
<script type="module" src="/app.js"></script>
</head>
<body><main>
<p class="muted">BYTE BACK · 3단계</p><h1>로그인 자료실</h1>
<p>실습용 가상 메모만 저장하세요. 로그인은 신원을 확인합니다. 다른 사용자의 자료 접근을 막는 소유권 검사는 다음 단계에서 완성합니다.</p>
<p class="muted">과거 공개 Git 커밋과 배포 사본은 현재 버전 수정만으로 회수되지 않습니다.</p>
<section aria-labelledby="login-title"><h2 id="login-title">계정 로그인</h2>
<p id="identity" role="status">로그인 상태 확인 중</p>
<form id="login-form"><label for="email">이메일</label><input id="email" name="email" type="email" autocomplete="username" required>
<label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit" id="login">로그인</button></form>
<button id="logout" type="button" hidden>로그아웃</button></section>
<p id="message" role="status" aria-live="polite"></p>
<section id="workspace" hidden aria-labelledby="notes-title"><h2 id="notes-title">내 가상 메모</h2>
<button id="refresh" type="button">목록 다시 불러오기</button>
<form id="note-form"><input id="note-id" type="hidden"><label for="title">제목</label><input id="title" maxlength="200" required>
<label for="body">내용</label><textarea id="body" maxlength="10000" required></textarea>
<button id="save" type="submit">메모 추가</button><button id="cancel-edit" type="button" hidden>수정 취소</button></form>
<div id="notes" aria-live="polite"></div></section>
</main></body></html>
